<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1520" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="400" height="1520" fill="#f8f9fa"/>

  <!-- Title Section -->
  <text x="200" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#111">HSC &amp; ATAR Timeline</text>
  <text x="200" y="52" text-anchor="middle" font-size="10" fill="#666">Verify against official NESA/UAC calendars</text>

  <!-- YEAR 10 -->
  <rect x="15" y="80" width="80" height="24" rx="12" fill="#94a3b8"/>
  <text x="55" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Year 10</text>
  <line x1="55" y1="104" x2="55" y2="380" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(0, 120)">
    <circle cx="55" cy="10" r="6" fill="#94a3b8"/>
    <rect x="75" y="0" width="310" height="40" rx="5" fill="#f1f5f9"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#475569">Term 1–2</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #64748b; padding-top: 2px;">Research senior subjects and attend info evenings.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 175)">
    <circle cx="55" cy="10" r="7" fill="#f59e0b"/>
    <rect x="75" y="0" width="310" height="45" rx="5" fill="#fffbeb"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#92400e">Term 2–3</text>
    <foreignObject x="85" y="18" width="290" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #b45309; font-weight: bold; padding-top: 2px;">Subject selection for Year 11 opens. Most important decision.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 235)">
    <circle cx="55" cy="10" r="7" fill="#ef4444"/>
    <rect x="75" y="0" width="310" height="45" rx="5" fill="#fef2f2"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#991b1b">Term 3</text>
    <foreignObject x="85" y="18" width="290" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #dc2626; padding-top: 2px;">Final subject selections due. Changes later are difficult.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 295)">
    <circle cx="55" cy="10" r="6" fill="#94a3b8"/>
    <rect x="75" y="0" width="310" height="35" rx="5" fill="#f1f5f9"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#475569">Term 4</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #64748b; padding-top: 2px;">Prepare for Year 11; begin early for accelerated subjects.</div>
    </foreignObject>
  </g>

  <!-- YEAR 11 -->
  <rect x="15" y="370" width="80" height="24" rx="12" fill="#6366f1"/>
  <text x="55" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Year 11</text>
  <line x1="55" y1="394" x2="55" y2="700" stroke="#c7d2fe" stroke-width="2"/>

  <g transform="translate(0, 410)">
    <circle cx="55" cy="10" r="6" fill="#6366f1"/>
    <rect x="75" y="0" width="310" height="35" rx="5" fill="#eef2ff"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#3730a3">Term 1</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #4338ca; padding-top: 2px;">Preliminary courses begin. Confirm subject choices.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 460)">
    <circle cx="55" cy="10" r="6" fill="#6366f1"/>
    <rect x="75" y="0" width="310" height="40" rx="5" fill="#eef2ff"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#3730a3">Term 2–3</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #4338ca; padding-top: 2px;">Internal assessments. Build foundational knowledge.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 515)">
    <circle cx="55" cy="10" r="7" fill="#f59e0b"/>
    <rect x="75" y="0" width="310" height="40" rx="5" fill="#fffbeb"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#92400e">Term 3</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #b45309; font-weight: bold; padding-top: 2px;">Yearly Exams: Preliminary exams at many schools.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 570)">
    <circle cx="55" cy="10" r="7" fill="#6366f1"/>
    <rect x="75" y="0" width="310" height="65" rx="5" fill="#eef2ff"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#3730a3">Term 4</text>
    <foreignObject x="85" y="18" width="290" height="50">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #4338ca; padding-top: 2px;">
        Prelim courses wrap up. Begin HSC prep. <b>Note:</b> Some schools start formal HSC assessments this term.
      </div>
    </foreignObject>
  </g>

  <!-- YEAR 12 -->
  <rect x="15" y="680" width="80" height="24" rx="12" fill="#0891b2"/>
  <text x="55" y="696" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Year 12</text>
  <line x1="55" y1="704" x2="55" y2="1420" stroke="#a5f3fc" stroke-width="2"/>

  <g transform="translate(0, 720)">
    <circle cx="55" cy="10" r="6" fill="#0891b2"/>
    <rect x="75" y="0" width="310" height="45" rx="5" fill="#ecfeff"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#164e63">Term 1 (Start)</text>
    <foreignObject x="85" y="18" width="290" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #0e7490; font-weight: bold; padding-top: 2px;">HSC year begins. Read your Assessment Schedule carefully.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 780)">
    <circle cx="55" cy="10" r="7" fill="#ef4444"/>
    <rect x="75" y="0" width="310" height="50" rx="5" fill="#fef2f2"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#991b1b">Term 1 (End) ⚠️</text>
    <foreignObject x="85" y="18" width="290" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #dc2626; font-weight: bold; padding-top: 2px;">UCAT (Med) &amp; EAS apps open. Do NOT miss deadlines.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 845)">
    <circle cx="55" cy="10" r="7" fill="#059669"/>
    <rect x="75" y="0" width="310" height="40" rx="5" fill="#ecfdf5"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#064e3b">Term 2</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #047857; font-weight: bold; padding-top: 2px;">UAC applications open. Start listing preferences.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 900)">
    <circle cx="55" cy="10" r="8" fill="#dc2626"/>
    <rect x="75" y="0" width="310" height="55" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="85" y="16" font-size="11" font-weight="800" fill="#7f1d1d">Term 3 — TRIAL EXAMS</text>
    <foreignObject x="85" y="18" width="290" height="45">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #b91c1c; padding-top: 2px;">Weighting (30–50%). School rank locks in after this.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 970)">
    <circle cx="55" cy="10" r="7" fill="#ef4444"/>
    <rect x="75" y="0" width="310" height="50" rx="5" fill="#fef2f2"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#991b1b">Term 3 (Sep) ⚠️</text>
    <foreignObject x="85" y="18" width="290" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #dc2626; padding-top: 2px;">Portfolio submissions, Music auditions, Medical interviews.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 1035)">
    <circle cx="55" cy="15" r="9" fill="#be185d"/>
    <rect x="75" y="0" width="310" height="55" rx="5" fill="#fdf2f8" stroke="#be185d" stroke-width="1"/>
    <text x="85" y="16" font-size="11" font-weight="800" fill="#831843">Term 4 — HSC WRITTEN EXAMS</text>
    <foreignObject x="85" y="18" width="290" height="45">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #be185d; padding-top: 2px;">Exams run ~4–5 weeks. Final UAC preference deadline.</div>
    </foreignObject>
  </g>

  <g transform="translate(0, 1105)">
    <circle cx="55" cy="10" r="8" fill="#7c3aed"/>
    <rect x="75" y="0" width="310" height="45" rx="5" fill="#f5f3ff"/>
    <text x="85" y="16" font-size="11" font-weight="800" fill="#4c1d95">Term 4 (End)</text>
    <foreignObject x="85" y="18" width="290" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #7c3aed; font-weight: bold; padding-top: 2px;">ATAR RELEASED. Check results and finalise preferences.</div>
    </foreignObject>
  </g>

  <!-- OFFERS -->
  <rect x="15" y="1180" width="80" height="24" rx="12" fill="#059669"/>
  <text x="55" y="1196" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Offers</text>
  
  <g transform="translate(0, 1220)">
    <circle cx="55" cy="10" r="7" fill="#059669"/>
    <rect x="75" y="0" width="310" height="40" rx="5" fill="#ecfdf5"/>
    <text x="85" y="16" font-size="11" font-weight="700" fill="#064e3b">Jan / Feb</text>
    <foreignObject x="85" y="18" width="290" height="30">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 10px; color: #047857; padding-top: 2px;">Main Round Offers and University orientation.</div>
    </foreignObject>
  </g>

  <!-- LEGEND -->
  <rect x="15" y="1300" width="370" height="150" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="1322" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">School Term Guide</text>
  
  <g font-size="11" fill="#475569">
    <text x="35" y="1345" font-weight="bold">Term 1:</text> <text x="100" y="1345">Late Jan – Early Apr</text>
    <text x="35" y="1370" font-weight="bold">Term 2:</text> <text x="100" y="1370">Late Apr – Early Jul</text>
    <text x="35" y="1395" font-weight="bold">Term 3:</text> <text x="100" y="1395">Late Jul – Late Sep</text>
    <text x="35" y="1420" font-weight="bold">Term 4:</text> <text x="100" y="1420">Mid Oct – Mid Dec</text>
  </g>

  <text x="200" y="1485" text-anchor="middle" font-size="10" fill="#94a3b8">nesa.nsw.edu.au | uac.edu.au</text>
</svg>
